name: Build Site

on:
  push:
    paths:
      - 'README.md'
      - 'apps.css'
      - 'tests/catalog.test.cjs'
      - 'scripts/build-site.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Convert README to HTML
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Test the generated catalog
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/catalog:ro" --workdir /catalog node:22.22.0-bookworm-slim node --test tests/catalog.test.cjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet index.html 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate index.html from README.md"
          git push
