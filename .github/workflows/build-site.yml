name: Build Site

on:
  push:
    paths:
      - 'README.md'
      - 'apps.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Convert README to HTML
        run: |
          npm install marked

          node << 'EOF'
          const { marked } = require('marked');
          const fs = require('fs');

          const readme = fs.readFileSync('README.md', 'utf8');
          const content = marked.parse(readme);

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Robert Vanderbei's Java Applications</title>
              <link rel="stylesheet" href="apps.css">
          </head>
          <body>
              <header>
                  <div class="container">
                      <h1><a href="https://vanderbei.princeton.edu">Professor Robert Vanderbei</a>'s Java Applications</h1>
                      <a href="https://github.com/pubino/vanderbei-apps" class="github-badge" title="View on GitHub">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                      </a>
                  </div>
              </header>
              <main>
                  <div class="container">
                      ${content}
                  </div>
              </main>
              <footer>
                  <div class="container">
                      <p>Based on original work by <a href="https://vanderbei.princeton.edu/">Robert Vanderbei</a>, Princeton University</p>
                  </div>
              </footer>
          </body>
          </html>`;

          fs.writeFileSync('index.html', html);
          EOF

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet index.html 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate index.html from README.md"
          git push
